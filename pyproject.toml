[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dpnca"
version = "1.0.0"
description = "DPNCA-LM: an attention-free language model built on an iterative neural cellular automaton"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "tiktoken>=0.5",
    "safetensors>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-timeout", "scipy>=1.10"]
train = ["datasets>=2.14"]

[tool.setuptools.packages.find]
include = ["dpnca*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short -m 'not slow'"
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]
